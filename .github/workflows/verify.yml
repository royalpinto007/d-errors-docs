name: Verify documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1400
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The unpatched build-time deepmerge low advisory is documented in README.
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test:built
